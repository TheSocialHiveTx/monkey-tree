<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="Monkey Business Tree Care LLC Logo - Angry cartoon gorilla in lime-green shirt holding STIHL chainsaw">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8fd47a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b7d34" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1B3320"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8e34f"/>
      <stop offset="100%" stop-color="#72aa2b"/>
    </linearGradient>
    <linearGradient id="orangeStihl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF732E"/>
      <stop offset="50%" stop-color="#E6591F"/>
      <stop offset="100%" stop-color="#BC3E0E"/>
    </linearGradient>
    <linearGradient id="metalBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Black Bezel -->
  <circle cx="250" cy="250" r="244" fill="#14170F" stroke="#8FCB3E" stroke-width="8"/>
  <circle cx="250" cy="250" r="236" fill="none" stroke="#1B3320" stroke-width="4"/>
  <circle cx="250" cy="250" r="230" fill="#1B3320"/>

  <!-- Inner Scenic Background -->
  <circle cx="250" cy="190" r="170" fill="url(#skyGrad)"/>

  <!-- Background Oak Tree Silhouette -->
  <g opacity="0.6">
    <path d="M120,260 Q130,220 140,190 Q120,170 125,140 Q145,110 180,105 Q200,75 240,75 Q275,70 300,95 Q335,90 350,120 Q375,140 370,175 Q385,210 365,240 Q380,265 375,280 L120,280 Z" fill="#244E23"/>
    <circle cx="160" cy="150" r="35" fill="#2F6B2A"/>
    <circle cx="210" cy="115" r="45" fill="#387E32"/>
    <circle cx="270" cy="110" r="45" fill="#387E32"/>
    <circle cx="330" cy="145" r="40" fill="#2F6B2A"/>
  </g>

  <!-- Grassy Knoll Base -->
  <path d="M85,270 Q250,225 415,270 L415,310 Q250,320 85,310 Z" fill="#1B3320"/>

  <!-- ANGRY GORILLA MASCOT -->
  <g id="mascot-figure">
    <!-- Ears -->
    <circle cx="168" cy="122" r="22" fill="#5A3825" stroke="#14170F" stroke-width="4"/>
    <circle cx="168" cy="122" r="14" fill="#8C583B"/>
    <circle cx="332" cy="122" r="22" fill="#5A3825" stroke="#14170F" stroke-width="4"/>
    <circle cx="332" cy="122" r="14" fill="#8C583B"/>

    <!-- Head & Brow Shape -->
    <path d="M185,140 C175,75 325,75 315,140 C325,185 320,210 250,212 C180,210 175,185 185,140 Z" fill="#5A3825" stroke="#14170F" stroke-width="5"/>
    <!-- Crest/Hair Tuft -->
    <path d="M230,85 L250,62 L270,85 Z" fill="#4A2E1E"/>

    <!-- Face Plate (Tan / Muzzle) -->
    <path d="M192,130 C195,105 240,105 250,115 C260,105 305,105 308,130 C310,155 305,200 250,202 C195,200 190,155 192,130 Z" fill="#C99368" stroke="#14170F" stroke-width="4"/>

    <!-- Heavy Angry Brow Ridges -->
    <path d="M195,118 Q235,135 248,128 Q235,115 195,118 Z" fill="#422515"/>
    <path d="M305,118 Q265,135 252,128 Q265,115 305,118 Z" fill="#422515"/>

    <!-- Angry Glaring Eyes -->
    <polygon points="208,126 238,136 214,142" fill="#FFFFFF" stroke="#14170F" stroke-width="3"/>
    <circle cx="225" cy="134" r="5" fill="#14170F"/>
    <polygon points="292,126 262,136 286,142" fill="#FFFFFF" stroke="#14170F" stroke-width="3"/>
    <circle cx="275" cy="134" r="5" fill="#14170F"/>

    <!-- Nose / Snout -->
    <ellipse cx="250" cy="148" rx="14" ry="8" fill="#52311C"/>
    <ellipse cx="245" cy="149" rx="3.5" ry="4" fill="#14170F"/>
    <ellipse cx="255" cy="149" rx="3.5" ry="4" fill="#14170F"/>

    <!-- Wide Furious Gritted Teeth Mouth -->
    <path d="M205,162 Q250,156 295,162 Q290,195 250,196 Q210,195 205,162 Z" fill="#FFFFFF" stroke="#14170F" stroke-width="4"/>
    <!-- Tooth Divider Lines -->
    <line x1="206" y1="178" x2="294" y2="178" stroke="#14170F" stroke-width="3"/>
    <line x1="216" y1="162" x2="216" y2="194" stroke="#14170F" stroke-width="2.5"/>
    <line x1="228" y1="160" x2="228" y2="195" stroke="#14170F" stroke-width="2.5"/>
    <line x1="240" y1="159" x2="240" y2="196" stroke="#14170F" stroke-width="2.5"/>
    <line x1="250" y1="158" x2="250" y2="196" stroke="#14170F" stroke-width="2.5"/>
    <line x1="260" y1="159" x2="260" y2="196" stroke="#14170F" stroke-width="2.5"/>
    <line x1="272" y1="160" x2="272" y2="195" stroke="#14170F" stroke-width="2.5"/>
    <line x1="284" y1="162" x2="284" y2="194" stroke="#14170F" stroke-width="2.5"/>

    <!-- Lime Green Long-Sleeve Shirt Torso & Arms -->
    <path d="M165,220 Q250,210 335,220 L350,285 Q250,295 150,285 Z" fill="url(#limeGrad)" stroke="#14170F" stroke-width="5"/>
    <!-- Left Arm Sleeve -->
    <path d="M175,220 C140,230 115,255 125,290 C145,295 170,270 178,250 Z" fill="#8FCB3E" stroke="#14170F" stroke-width="4"/>
    <!-- Right Arm Sleeve -->
    <path d="M325,220 C360,230 385,255 375,290 C355,295 330,270 322,250 Z" fill="#8FCB3E" stroke="#14170F" stroke-width="4"/>

    <!-- Mini Monkey Head Patch on Shirt -->
    <circle cx="288" cy="245" r="14" fill="#C99368" stroke="#14170F" stroke-width="2"/>
    <circle cx="282" cy="242" r="2" fill="#14170F"/>
    <circle cx="294" cy="242" r="2" fill="#14170F"/>
    <rect x="282" y="247" width="12" height="6" rx="2" fill="#FFFFFF" stroke="#14170F" stroke-width="1.5"/>

    <!-- Muscular Furry Paws Gripping Chainsaw -->
    <!-- Left Paw on Top Handle -->
    <ellipse cx="140" cy="290" rx="18" ry="16" fill="#5A3825" stroke="#14170F" stroke-width="4"/>
    <circle cx="132" cy="285" r="5" fill="#C99368"/>
    <circle cx="140" cy="283" r="5" fill="#C99368"/>
    <circle cx="148" cy="285" r="5" fill="#C99368"/>
    <!-- Right Paw on Chainsaw Body/Rear Grip -->
    <ellipse cx="360" cy="290" rx="18" ry="16" fill="#5A3825" stroke="#14170F" stroke-width="4"/>
    <circle cx="352" cy="285" r="5" fill="#C99368"/>
    <circle cx="360" cy="283" r="5" fill="#C99368"/>
    <circle cx="368" cy="285" r="5" fill="#C99368"/>

    <!-- CHAINSAW (STIHL ORANGE & WHITE HEAVY DUTY) -->
    <g id="chainsaw">
      <!-- Chainsaw Metal Guide Bar -->
      <path d="M145,280 L52,274 C44,274 38,280 38,288 C38,296 44,302 52,302 L145,296 Z" fill="url(#metalBar)" stroke="#14170F" stroke-width="4"/>
      <!-- Saw Chain Teeth Details -->
      <line x1="42" y1="274" x2="145" y2="280" stroke="#14170F" stroke-width="3" stroke-dasharray="6,4"/>
      <line x1="42" y1="302" x2="145" y2="296" stroke="#14170F" stroke-width="3" stroke-dasharray="6,4"/>
      <ellipse cx="50" cy="288" rx="5" ry="5" fill="#64748B"/>
      <!-- STIHL text on bar -->
      <text x="75" y="293" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="12" fill="#14170F" letter-spacing="1">STIHL</text>

      <!-- Chainsaw Engine Body -->
      <!-- White Lower Crankcase -->
      <rect x="145" y="270" width="115" height="50" rx="8" fill="#F8FAFC" stroke="#14170F" stroke-width="4"/>
      <!-- Engine Air Vents -->
      <rect x="155" y="280" width="40" height="30" rx="4" fill="#334155" stroke="#14170F" stroke-width="2"/>
      <line x1="160" y1="285" x2="190" y2="285" stroke="#94A3B8" stroke-width="2"/>
      <line x1="160" y1="290" x2="190" y2="290" stroke="#94A3B8" stroke-width="2"/>
      <line x1="160" y1="295" x2="190" y2="295" stroke="#94A3B8" stroke-width="2"/>
      <line x1="160" y1="300" x2="190" y2="300" stroke="#94A3B8" stroke-width="2"/>

      <!-- Orange Engine Shroud / Top Cover -->
      <path d="M150,270 L158,235 C160,230 166,226 172,226 L235,226 C242,226 248,232 250,238 L255,270 Z" fill="url(#orangeStihl)" stroke="#14170F" stroke-width="4"/>
      <!-- STIHL label on orange cover -->
      <text x="180" y="254" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="14" fill="#FFFFFF" stroke="#14170F" stroke-width="1" letter-spacing="1">STIHL</text>

      <!-- Black Front Handlebar / Hand Guard -->
      <path d="M140,240 Q130,210 170,210 Q200,210 205,225" fill="none" stroke="#14170F" stroke-width="8" stroke-linecap="round"/>
      <path d="M145,260 L142,225" stroke="#14170F" stroke-width="6"/>

      <!-- Rear Handle & Trigger -->
      <path d="M255,260 L295,270 L285,310 L255,305 Z" fill="#F8FAFC" stroke="#14170F" stroke-width="4"/>
      <path d="M260,275 L285,280" stroke="#14170F" stroke-width="4"/>
    </g>
  </g>

  <!-- LOWER BANNER & BOLD DISTRESSED TYPOGRAPHY -->
  <g id="brand-typography">
    <!-- Dark Forest Green Plaque Base -->
    <path d="M60,320 L440,320 C440,400 370,470 250,475 C130,470 60,400 60,320 Z" fill="#14170F"/>

    <!-- Decorative Leaf Sprigs on Sides -->
    <path d="M78,355 Q62,342 74,328 Q90,340 78,355 Z" fill="#8FCB3E"/>
    <path d="M72,368 Q58,360 66,346 Q80,356 72,368 Z" fill="#8FCB3E"/>
    <path d="M422,355 Q438,342 426,328 Q410,340 422,355 Z" fill="#8FCB3E"/>
    <path d="M428,368 Q442,360 434,346 Q420,356 428,368 Z" fill="#8FCB3E"/>

    <!-- "MONKEY" Headline (Bold, distressed poster white) -->
    <text x="250" y="365" text-anchor="middle" font-family="'Anton', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="3" stroke="#14170F" stroke-width="3">MONKEY</text>

    <!-- "BUSINESS" Headline (Bold lime green with leaf accent) -->
    <text x="250" y="420" text-anchor="middle" font-family="'Anton', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#8FCB3E" letter-spacing="2" stroke="#14170F" stroke-width="2">BUSINESS</text>
    <!-- Leaf dotting the 'I' in BUSINESS (approx x=286, y=390) -->
    <path d="M284,386 Q294,374 290,388 Q286,396 284,386 Z" fill="#8FCB3E" stroke="#14170F" stroke-width="1.5"/>

    <!-- Bottom Pill Banner: "TREE CARE LLC" -->
    <g transform="translate(0, 428)">
      <!-- Banner Outline -->
      <path d="M125,18 L375,18" stroke="#8FCB3E" stroke-width="2"/>
      <!-- Text -->
      <text x="236" y="24" text-anchor="middle" font-family="'Anton', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">TREE CARE</text>
      <!-- Green Badge for LLC -->
      <rect x="312" y="5" width="46" height="24" rx="6" fill="#8FCB3E"/>
      <text x="335" y="23" text-anchor="middle" font-family="'Anton', 'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#14170F">LLC</text>
    </g>
  </g>

  <!-- Outer Ring Accent Leaves -->
  <path d="M100,432 Q106,420 116,426 Q112,438 100,432 Z" fill="#8FCB3E"/>
  <path d="M400,432 Q394,420 384,426 Q388,438 400,432 Z" fill="#8FCB3E"/>
</svg>
